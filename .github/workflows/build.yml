name: Ledger Database Build and Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - docker-image
  pull_request:
    branches:
      - main

env:
  MAIN_BRANCH: refs/heads/main
  IMAGE_NAME: ghcr.io/dfe-digital/schoolaccount-collectstateledgerdatabase
  LOCAL_TAG: ledger-database:ci

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == env.MAIN_BRANCH }}
            type=ref,event=branch

      - name: Build and verify the image
        run: docker compose up --build --wait --wait-timeout 300

      - name: Tear down
        if: ${{ always() }}
        run: docker compose down --volumes

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          tags="${{ steps.meta.outputs.tags }}"
          if [ -z "$tags" ]; then
            echo "No tags were generated, so there is nothing to push" >&2
            exit 1
          fi
          for tag in $tags; do
            docker tag ${{ env.LOCAL_TAG }} "$tag"
            docker push "$tag"
          done
